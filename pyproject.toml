[project]
name = "jairocloud-groups-manager"
version = "1.0.0a2"
authors = [
  {name = "National Institute of Informatics"}
]
description = "A web client for JAIRO Cloud repository administrators to manage groups in the GakuNin Cloud Gateway."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.14"
dependencies = [
  "celery[redis]>=5.6.2",
  "flask>=3.1.3",
  "flask-login>=0.6.3",
  "flask-pydantic>=0.14.0",
  "flask-sqlalchemy>=3.1.1",
  "openpyxl>=3.1.5",
  "psycopg[binary]>=3.3.3",
  "pydantic-settings>=2.13.1",
  "pydantic[email]>=2.12.5",
  "requests>=2.32.5",
  "sqlalchemy-utils>=0.42.1",
  "weko-group-cache-db",
]

[dependency-groups]
dev = [
  "celery-types>=0.24.0",
  "pyright>=1.1.408",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "taskipy>=1.14.1",
]

[project.scripts]
jairocloud-groups-manager = "server.app:cli"


[tool.taskipy.tasks]
# refer to https://github.com/taskipy/taskipy?tab=readme-ov-file#usage
"test" = "pytest"
"coverage" = "pytest --cov=server --cov-report=term --cov-report=html"
"lint" = "uvx ruff check"
"lint:fix" = "uvx ruff check --fix"
"format" = "uvx ruff format"
"generate-stubs" = "python src/contrib/messages.py"
"typecheck" = "task generate-stubs && pyright"
"check-updates" = "uvx --from=pip-check-updates pcu pyproject.toml"


[tool.pytest]
pythonpath = ["."]
addopts = [
    "--import-mode=importlib",
]

[tool.coverage.run]
branch = true
source = ["src/server"]

[tool.coverage.report]
omit = ["__init__.py", "src/contrib/*", "tests/*"]
exclude_also = [
  "if t.TYPE_CHECKING:",
]


[tool.ruff.lint]
# refer to https://docs.astral.sh/ruff/settings/#lint
ignore = [
  "COM812",
  "INP001",
  "D203",
  "D213",
  "TRY400",
]
preview = true
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/api/**.py" = ["TC001", "TC002", "TC003"]
"**/entities/**.py" = ["TC001", "TC002", "TC003"]
"*.pyi" = ["CPY001", "E501"]

[tool.ruff.lint.isort]
# refer to https://docs.astral.sh/ruff/settings/#lintisort
combine-as-imports = true
lines-after-imports = 2
lines-between-types = 1
known-first-party = ["server"]
sections = { "testing-helpers" = ["tests"] }
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "testing-helpers",
  "local-folder",
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.analyze]
# refer to https://docs.astral.sh/ruff/settings/#analyze
detect-string-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# refer to https://docs.astral.sh/ruff/settings/#format
preview = true
skip-magic-trailing-comma = false


[tool.pyright]
include = ["src"]
extraPaths = ["src"]
typeCheckingMode =  "standard"

[tool.uv.sources]
weko-group-cache-db = { git = "https://github.com/ivis-weko3-dev/weko-group-cache-db.git", rev = "develop" }
