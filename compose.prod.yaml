# Docker Compose configuration for development environment

services:
  web:
    extends:
      file: compose.service.yaml
      service: backend
    ports:
      - "5050:5050"
    networks:
      - default

  worker:
    extends:
      file: compose.service.yaml
      service: backend
    build:
      target: prod
    container_name: worker
    command: "/usr/bin/supervisord -c supervisord.worker.conf"
    depends_on:
      - sentinel-1
      - sentinel-2
      - sentinel-3
      - rabbitmq
    networks:
      - default


  nginx:
    extends:
      file: compose.service.yaml
      service: nginx
    depends_on:
      - web
    networks:
      - default

  postgres:
    extends:
      file: compose.service.yaml
      service: postgres
    networks:
      - default


  redis-master:
    extends:
      file: compose.service.yaml
      service: redis-master
    ports:
      - "6379:6379"
    networks:
      - default

  redis-replica-1:
    extends:
      file: compose.service.yaml
      service: redis
    container_name: redis-replica-1
    command: >
      redis-server
      --replicaof redis-master 6379
      --appendonly yes
      --replica-announce-ip redis-replica-1
      --replica-announce-port 6379
    depends_on:
      - redis-master
    networks:
      - default

  redis-replica-2:
    extends:
      file: compose.service.yaml
      service: redis
    container_name: redis-replica-2
    command: >
      redis-server
      --replicaof redis-master 6379
      --appendonly yes
      --replica-announce-ip redis-replica-2
      --replica-announce-port 6379
    depends_on:
      - redis-master
    networks:
      - default

  sentinel-1:
    extends:
      file: compose.service.yaml
      service: sentinel
    container_name: sentinel-1
    depends_on: &sentinel-depends-on
      - redis-master
      - redis-replica-1
      - redis-replica-2
    ports:
      - "26379:26379"
    networks:
      - default

  sentinel-2:
    extends:
      file: compose.service.yaml
      service: sentinel
    container_name: sentinel-2
    depends_on: *sentinel-depends-on
    networks:
      - default

  sentinel-3:
    extends:
      file: compose.service.yaml
      service: sentinel
    container_name: sentinel-3
    depends_on: *sentinel-depends-on
    networks:
      - default


  rabbitmq:
    extends:
      file: compose.service.yaml
      service: rabbitmq


volumes:
  pgdata:

networks:
  default:
    external: true
    name: jairocloud-groups-manager_default
